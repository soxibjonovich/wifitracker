[project]
name = "wifitracker"
version = "0.1.0"
description = "CLI tool for TP-Link routers: monitor devices, block them and limit their daily online time"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=14.3.4",
    "tplinkrouterc6u>=5.18.0",
    "typer>=0.24.1",
]

[project.scripts]
wifitracker = "wifitracker.main:app"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.uv.sources]
# block_device / unblock_device for Archer C24 / C80 are in the fork, not on PyPI yet.
tplinkrouterc6u = { git = "https://github.com/soxibjonovich/TP-Link-Archer-C6U", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wifitracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
